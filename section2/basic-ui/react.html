<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple HTML using React</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div id="root"></div>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script>
        const randomNumber = Math.floor(Math.random() * 100)+1;
        const numberElement = React.createElement('h1', null, `Generated Number: ${randomNumber}`);
        const resultElement = React.createElement('h2', {style: {color: 'blue'}}, randomNumber % 2 == 0 ? "The number is even." : "The number is odd.");


        const root = ReactDOM.createRoot(document.getElementById("root"));
        // root.render([numberElement, resultElement]);
        root.render(React.createElement("div", {id: "childDiv"}, [numberElement, resultElement]));

    </script>
</body>
</html>
